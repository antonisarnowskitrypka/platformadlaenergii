        <script>
        document.getElementById("tab2").style.display = "flex";
        let currentIndex = 0;
        const success = document.getElementById("contactSuccess");
        const sendBtn = document.getElementById("sendBtn");
    
    
    
    
        document.getElementById('contactForm').addEventListener('submit', function(e) {
          e.preventDefault(); // Prevent the default form submission
    
          console.log('o');
    
          // Get form values
          let email = document.getElementById('email').value;
          let title = document.getElementById('title').value;
          let phone = document.getElementById('phone').value;
          let body = document.getElementById('body').value;
    
          // Create the data object
          let data = {
            email: email,
            title: title,
            phone: phone,
            body: body
          };
    
          // Make a POST request to the specified URL
          fetch('https://platformadlaenergii.pl/ec/api/usermgmt/members/contactForm', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
          })
                  .then(response => {
                    if (response.ok) {
                      // Handle success
                      console.log('Form submitted successfully');
                      // You can add further actions here upon successful submission
                    } else {
                      // Handle errors
                      console.log('Form submission failed');
                    }
                  })
                  .catch(error => {
                    console.error('Error:', error);
                  })
                  .finally(() => {
                    document.getElementById('email').value = '';
                    document.getElementById('title').value = '';
                    document.getElementById('phone').value = '';
                    document.getElementById('body').value = '';
                    success.style.display = "flex";
                    sendBtn.style.display = 'none';
                  });
        });
    
        function openTab(evt, tabName) {
          var i, tabContent, tabButtons;
          tabContent = document.getElementsByClassName("ecTile");
          for (i = 0; i < tabContent.length; i++) {
            tabContent[i].style.display = "none";
          }
    
          tabButtons = document.getElementsByClassName("tab-button");
          for (i = 0; i < tabButtons.length; i++) {
            tabButtons[i].className = tabButtons[i].className.replace(" active", "");
          }
    
          document.getElementById(tabName).style.display = "flex";
          evt.currentTarget.className += " active";
        }
    
    
      </script>
  
    </body>

    
    </html>

