apiVersion: v1
data:
  landingPage.html: |-
    <!DOCTYPE html>
    <html lang="en">
      <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Platforma dla Energii oferuje eksperckie analizy i innowacyjne rozwiązania dla zrównoważonej energii w Polsce. Odkryj technologie odnawialnych źródeł energii, aktualności z branży i zasoby dla czystszego, ekologicznego jutra.">
      <link href="assets/partners/stylesheet.css" rel="stylesheet">
      <link rel="icon" href="assets/favicon.png" type="image/png">
      <title>C4E - Platforma dla Energii</title>
      <style>
      
          * {
      box-sizing: border-box;

      font-style: normal;
      font-weight: 500;
      line-height: normal;
    }

    body {
      font-family: "TT Hoves", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff; /* White background */
      color: #212121;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .button {
      display: flex;
      min-width: 150px;
      height: 48px;
      padding: 10px 22px;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-size: 16px;
    }

    .bigButton {
      padding: 10px 200px !important;
    }

    @media screen and (width <= 1050px) {
      .bigButton {
        padding: 10px !important;
        align-self: stretch;
      }
    }

    .rnd {
      border-radius: 28px;
    }

    .black {
      background: #212121;
      color: #FFF;
      font-weight: 700;
    }

    .white {
      background: white;
    }

    .borderOnly {
      border: 1px solid #212121;
      background: none;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      font-weight: 500;
      margin: 0;
      width: 100%;
    }

    h2 {
      font-size: 40px;
      font-weight: 500;
      line-height: 50px; /* 125% */
      margin: 0;
    }

    h3 {
      font-size: 40px;
      font-style: italic;
      font-weight: 400;
      margin: 0;
    }

    h4 {
      font-size: 32px;
      font-weight: 400;
      margin: 0;
    }

    h5 {
      color: #3453CD;
      font-size: 24px;
      font-weight: 500;
      line-height: 32px; /* 133.333% */
      margin: 0;
    }

    small {
      font-size: 16px;
      font-weight: 400;
    }
  
    ul {
      flex: 1 1;
      list-style: none;
      padding-left: 0;
    }
      
    li {
      padding-left: 54px; /* Create space for the image */
      position: relative;
      min-height: 30px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 400;
      line-height: 32px; /* 160% */
    }
      
    li::before {
      content: url('assets/check.svg'); /* Custom image */
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%); /* Vertically centers the image */
      height: 30px; /* Adjust this based on your image size */
      width: 30px;
    }
      
      /*
      
      HEADER
      
      */
      
      header {
    display: flex;
    width: 100%;
    padding: 20px 56px;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    background: #FAF3EC;
    }
    
    #menu {
    display: flex;
    width: 100%;
    padding: 8px 0;
    justify-content: space-between;
    align-items: center;
    }
    #menuButtons {
    display: flex;
    align-items: center;
    gap: 12px;
    }
    
    #hero {
    width: 100%;
    height: 790px;
    flex-shrink: 0;
    border-radius: 20px;
    /* background: url(<path-to-image>) lightgray  no-repeat; */
    background: url('assets/hero.webp') lightgray no-repeat;
    background-size: cover;
    position: relative;
    }
    
    @media screen and (width <= 1200px) {
      #hero {
        background: url('assets/hero-small.webp') lightgray no-repeat;
      }
    }   
    
    
    #heroTile {
    position: absolute;
    display: flex;
    width: 85%;
    left: 65px;
    bottom: 65px;
    max-width: 1306px;
    padding: 38px 55px;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.64);
    }
      
      header p {
    margin-top: 40px;
    color: #212121;
    font-size: 20px;
    font-weight: 500;
    }
      
      @media screen and (width <= 750px) {
    #heroTile {
    left: 20px;
    bottom: 20px;
    }
    }
      
      @media screen and (width <= 620px) {
    #menu {
    flex-direction: column;
    gap: 30px;
    }
    }
      
      @media screen and (width <= 550px) {
    #heroTile {
    width: 91%;
    left: 15px;
    bottom: 15px;
    padding: 15px
    }
    
    #heroTile h2 {
    font-size: 32px;
    }
      
      header {
    padding: 20px;
    }
    }
      
      /* GIFT */
    
    #gift {
    display: flex;
    padding: 80px 106px;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    align-self: stretch;
    width: 100%;
    background: #FAF3EC;
    }
    
    #giftInner {
    width: 100%;
    display: flex;
    padding: 32px 60px;
    align-items: center;
    gap: 64px;
    align-self: stretch;
    border-radius: 20px;
    background: #3453CD;
    color: white;
    justify-content: center;
    }
    
    #giftInner div {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 29px;
    }
      
      @media screen and (width <= 970px) {
    #gift {
    padding: 60px 40px;
    }
    }
      
    @media screen and (width <= 780px) {
      #giftInner {
      flex-direction: column-reverse;
      }
      #giftInner h3 {
        font-size: 32px;
      }
      #giftInner h4 {
        font-size: 28px;
      }
    }
      
      /* OFFER */
    
    #offer {
    display: flex;
    padding: 80px 106px;
    flex-direction: column;
    align-items: flex-start;
    gap: 64px;
    align-self: stretch;
    background: #E5F1FC;
    width: 100%;
    }
    
    #offer .tile {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-radius: 20px;
    background: white;
    }
    
    
    #offer .row {
    display: flex;
    padding: 64px 56px;
    justify-content: space-between;
    align-items: center;
    align-self: stretch;
    gap: 64px;
    }
    
    #offer .text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    }
    
    #offer .text p {
    font-size: 20px;
    font-weight: 400;
    line-height: 32px; /* 160% */
    }
    
    #offer .row img {
    border-radius: 20px;
    max-width: 380px;
    width: 100%;
      min-width: 240px;
    }
      
      #offer .tile2 {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-radius: 20px;
      background: white;
      padding: 55px;
    }
      
      #offer .tile2 p {
      font-size: 20px;
      font-weight: 500;
      line-height: 32px; /* 160% */
    }
      
      #offer .lists {
      display: flex;
      gap: 32px;
      width: 100%;
      justify-content: space-between;
      margin: 50px 0;
    }
      
      @media screen and (width <= 600px) {
      #offer {
      padding: 60px 15px;
    }
    }
    
    @media screen and (width <= 1050px) {
      #offer .row {
        flex-direction: column;
        gap: 20px;
        padding: 25px;
      }

      #offer .rev {
        flex-direction: column-reverse;
      }

      #offer .lists {
        flex-direction: column;
        gap: 0;
      }
      #offer .text {
        gap: 10px;
      }

      #offer .text p {
        font-size: 18px;
      }

      #offer h5 {
        font-size: 20px;
      }
    }
      
      
      
      /* BENEFITS */
      
      #benefits {
      display: flex;
      padding: 80px 106px;
      flex-direction: column;
      align-items: flex-start;
      gap: 64px;
      background: #3453CD;
      width: 100%;
    }
      
      #benefits h1 {
      color: white;
    }
      
      #innerBenefits {
      display: flex;
      align-items: center;
      gap: 48px;
      align-self: stretch;
      flex-wrap: wrap;
      justify-content: center;
    }
      
      #innerBenefits .tile {
      display: flex;
      flex-direction: column;
      width: 380px;
      padding: 32px 32px 40px 32px;
      align-items: flex-start;
      gap: 24px;
      border-radius: 20px;
      background: #F2F7FF;
      justify-content: flex-start;
      height: 340px;
    }
      
      #innerBenefits .tile .row {
      display: flex;
      height: 100px;
      align-items: center;
      gap: 16px;
      align-self: stretch;
    }
      
      #innerBenefits p {
      font-size: 20px;
      font-weight: 400;
      line-height: 32px; /* 160% */
      margin: 0;
    }
      
      @media screen and (width <= 1020px) {
      #benefits {
      padding: 60px 40px;
    }
    }
      
      @media screen and (width <= 880px) {
      #innerBenefits .tile {
      min-width: 340px;
      align-self: stretch;
    }
      #benefits {
      padding: 60px 15px;
    }
    }
      
      /* TABS */
      
      #tabsContainer {
      display: flex;
      padding: 80px 106px;
      flex-direction: column;
      align-items: center;
      gap: 64px;
      align-self: stretch;
      background: #FAFAFA;
    
    }
      
      #tabs {
      display: flex;
      width: 664px;
      height: 48px;
      align-items: center;
      border-radius: 24px;
      border: 1px solid #DADEE3;
    }
      
      #tabs button {
      display: flex;
      padding: 10px 12px;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex: 1 0 0;
      align-self: stretch;
      border-radius: 24px;
      margin: 4px;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
      
      #tabs button:not(.active):hover {
      background: white;
    }
      
      #tabs .active  {
      background: #3453CD;
      color: white;
    }
      
      .ecTile {
      display: none;
      justify-content: space-between;
      width: 100%;
      margin: 64px 0;
      align-items: center;
      background: white;
      border-radius: 20px;
      overflow: hidden;
    }
      
      
      
      .ecTile .active {
      display: flex;
    }
      
      .ecTile .inner {
      display: flex;
      flex: 1 1;
      padding: 44px;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      flex-shrink: 0;
    }
      
      .ecTile p {
      font-size: 24px;
      font-weight: 500;
      line-height: 32px; /* 133.333% */
    }
      
      .ecTile .img {
      width: 25%;
    align-self: stretch;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }
      
     @media screen and (width <= 700px) {
      #tabs {
        width: 100%;
        height: auto;
      }
      #tabs button {
        padding: 15px 12px;
      }
    }
      
      @media screen and (width <= 880px) {
      #tabsContainer {
      padding: 60px 15px;
    }
    }
      
      @media screen and (width <= 1140px) {
      .ecTile {
      margin: 30px 0;
      flex-direction: column;
    }
      
      .ecTile .img {
      width: 100%;
      height: 260px;
      align-self: stretch;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }
    }
      
      /* HOW IT WORKS */
      
      #howItWorks {
      display: flex;
      width: 100%;
      padding: 80px 106px;
      flex-direction: column;
      align-items: center;
      gap: 64px;
    }
      
      #howItWorks .inner {
      display: flex;
      max-width: 560px;
      align-self: stretch;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0 auto;

    }
      
      #howItWorks p {
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      line-height: 32px; /* 160% */
      margin-bottom: 32px;
      margin-top: 0;
    }
      
      #howItWorks img {
      width: 100%;
    }
      
      
      @media screen and (width <= 880px) {
      #howItWorks {
      padding: 60px 15px;
    }
    }
      
      /* OPINIONS */
      
      #opinions {
      display: flex;
      padding: 80px 26px;
      flex-direction: column;
      align-items: flex-start;
      gap: 48px;
      align-self: stretch;
      width: 100%;
      background: #FAF3EC;
    }
      
      #opinions .inner {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      flex-wrap: wrap;
    }
      
      #opinions .tile {
      display: flex;
      flex-direction: column;
      min-width: 320px;
      max-width: 590px;
      padding: 64px 56px;
      align-items: flex-start;
      gap: 64px;
      border-radius: 20px;
      background: #FFF;
      flex: 1 1;
      align-self: stretch;
      justify-content: space-between;
    }
      
      #opinions .tile p {
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      line-height: 32px; /* 160% */
    }
      
      #opinions .tile span {
      font-size: 20px;
      font-weight: 500;
      line-height: 32px; /* 160% */
    }
    
        @media screen and (width <= 740px) {
      #opinions .tile {
        padding: 30px;
      }

      #opinions .inner {
        flex-wrap: initial;
        overflow: scroll;
        justify-content: flex-start;
      }
    }
    
    
      /* CLIENTS */
      
      #clients {
      display: flex;
      padding: 80px 106px;
      flex-direction: column;
      align-items: center;
      gap: 64px;
      align-self: stretch;
      width: 100%;
      background: #D0E1FF;
    }
      
      #logoGallery {
      display: flex;
      align-items: center;
      gap: 55px;
      flex-wrap: wrap;
      justify-content: center;
          width: 100%;

    }
      
      .logoTile {
      width: 200px;
      height:200px;
      padding: 25px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
          flex-shrink: 0;

    }
      
      .logoTile img {
      width: 100%;
    }
      
          @media screen and (width <= 1435px) {
      #logoGallery {
        gap: 15px;
      }
    }

    @media screen and (width <= 1280px) {
      .logoTile {
        width: 140px;
        height: 140px;
      }

      #clients {
        padding: 80px 25px;
      }
    }

    @media screen and (width <= 815px) {
      #logoGallery {
        overflow: scroll;
        flex-wrap: initial;
        justify-content: flex-start;
      }
    }

      /* FOOTER */
      
      footer {
      display: flex;
      width: 100%;
      padding: 80px 106px;
      flex-direction: column;
      align-items: center;
      gap: 92px;
      background: #0D2170;
    }
      
      footer .footerDiv {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 67px;
      flex: 1 1;
      align-self: stretch;
    }
      
      footer h1 {
      color: #FFF;
      text-align: center;
      font-size: 36px;
      font-style: normal;
      font-weight: 500;
      line-height: normal;
      margin-bottom: 20px;
    
    }
      
      footer small {
      color: #FFF;
      text-align: center;
      font-size: 16px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
    }
      
      footer b {
      color: #A2C6FF;
      font-weight: 500;
      line-height: normal;
      text-decoration-line: underline;
      cursor: pointer;
    }
      
      form {
      display: flex;
      align-items: flex-start;
      gap: 163px;
      align-self: stretch;
      flex-wrap: wrap;
      width: 100%;
      justify-content: center;
    }
      
      @media screen and (width <= 1075px) {
      form {
      gap: 10px;
      flex-direction: column;
    }
    }
      
      .formRow {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      align-self: stretch;
      margin-bottom: 20px;
      min-width: 350px;
    
    }
      
      .formRow:not(.area) {
      border-bottom: 1px solid #E0E0E0;
      margin-bottom: 32px;
    
    }
      
      .formRow label {
      color: #F2F7FF;
      font-size: 16px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
    }
      
      .formRow label span {
      color: #CF2626;
    }
      
      .formRow input:not(#terms) {
      display: flex;
      width: 100%;
      padding: 10px;
      align-items: center;
      gap: 10px;
      align-self: stretch;
      background: none;
      border: none;
      color: #E0E0E0;
      font-size: 14px;
      font-weight: 400;
      line-height: normal;
    }
      
      .formRow textarea {
      border-radius: 4px;
      border: 1px solid #A2C6FF;
      display: flex;
      height: 125px;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      align-self: stretch;
      color: #E0E0E0;
      font-size: 14px;
      font-weight: 400;
      background: none;
    }
      
      #finish {
      color: #FFF;
      font-size: 16px;
      font-weight: 400;
      line-height: 100%; /* 16px */
      display: flex;
      justify-content: space-between;
      align-items: center;
      align-self: stretch;
    }
      
      #terms {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      position: relative;
    }
      
      #terms input[type="checkbox"] {
      display: block;
      width: 1px;
      position: absolute;
      z-index: -1;
    }
      
      /* Style the checkbox container */
      #terms span {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 2px solid #a2c6ff;
      background: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }
      
      /* Style when the checkbox is checked */
      #terms input[type="checkbox"]:checked + span {
      background: #A2C6FF;
      border-color: #A2C6FF;
    }
      
      /* Adding the checkmark when the checkbox is checked */
      #terms input[type="checkbox"]:checked + span::before {
      content: '';
      display: block;
      width: 10px;
      height: 10px;
      background-color: white;
      border-radius: 2px;
    }
      
      /* Optional: hover effect */
        #terms span:hover {
        border-color: #7FAFFF;
    }
      
      #sender {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
      
      #sender button {
      min-width: 230px;
    }
      
      #sender p {
      color: #F2F7FF;
      font-size: 16px;
      font-weight: 400;
      margin: 0;
    }
      
      #sender span {
      font-weight: 500;
    }
      
      
      @media screen and (width <= 600px) {
      footer {
    padding: 60px 15px;
    }
    #sender, #finish {
    flex-direction: column;
    gap: 20px;
    text-align: center;
    }
    }
      /* CAROUSEL */

      
      .carousel {
    display: flex;
    transition: transform 0.5s ease;
    width: 100%; /* Total 5 items, each 50% of container width */
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    }
      
      .carousel-item {
    max-width: 400px; /* 20% width of the carousel (5 items total in 100%) */
    min-width: 320px;
    flex: 1 1;
    height: 360px;
    flex-shrink: 0;
    background-color: white;
    text-align: justify;
    font-size: 20px;
    font-weight: 500;
    line-height: 33px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    }
      
      .carousel-item img {
    width: 100%;
    min-height: 220px; /* Adjust the max height as needed */
    }
      
      .notcenter {
    object-fit: cover;  /* Ensures the image fills the container */
    object-position: bottom right;
    }
      
      .carousel-item p {
    padding: 24px 24px 44px;
    }
      
      .prev {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 50px;
    z-index: 10;
    cursor: pointer;
    }
      
      .next {
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    right: 50px;
    z-index: 10;
    cursor: pointer;
    
    }
    
    @media screen and (width <= 910px) {

      .carousel {
      flex-wrap: initial;
      overflow-x: scroll;
      scroll-behavior: smooth; /* Optional, for smooth scrolling */
      padding: 0;
      margin: 0;            /* Removes any margin */
      box-sizing: border-box;
      justify-content: flex-start;
    }
    
    }
      
      /* ARTICLES */
    
    #articles {
    position: relative;
    padding: 80px 108px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 64px;
    background: #fafafa;
    }
    
    #movies {
    position: relative;
    padding: 80px 108px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 64px;
    background: #fafafa;
    }
      
       @media screen and (width <= 600px) {
          #articles, #movies, #clients {
            padding: 60px 20px;
          }
      }

        #contactSuccess {
        display: none;
        color: white;
        font-size: 24px;
      }
          
      </style>
      </head>
      
      <body>
    
      <header>
      <div id="menu">
