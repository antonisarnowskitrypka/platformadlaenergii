apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-router
  name: nginx-router
  namespace: nginx-router-preprod
spec:
  allocateLoadBalancerNodePorts: true
  clusterIPs: []
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - nodePort: 30472
      port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app: nginx-router
  sessionAffinity: None
  type: LoadBalancer
status:
  loadBalancer:
    ingress:
      - ip: 10.0.14.80
