apiVersion: v1
data:
  nginx.conf: |+
    user  nginx;
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
      worker_connections  1024;
    }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
      access_log  /var/log/nginx/access.log  main;
      sendfile        on;
      keepalive_timeout  65;
      server {
        charset utf-8;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
    
        server_name ui.devc4e.pl;
    
        ssl_certificate /etc/nginx/certs/c4e.crt;
        ssl_certificate_key /etc/nginx/certs/c4e.key;
    
    	ssl_session_timeout 15m;
    	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    	ssl_ciphers HIGH+kEECDH+AESGCM:HIGH+kEECDH:HIGH+kEDH:HIGH:!aNULL;
        ssl_prefer_server_ciphers on;
    
        location /api {
            proxy_pass http://api-gateway-and-composer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 100M;
        }
    
        location /img {
            root /app;
        }
    
        location / {
          root   /app;
          index  index.html;
          try_files $uri $uri/ /index.html;
                # kill cache
          add_header Last-Modified $date_gmt;
          add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
          if_modified_since off;
          expires off;
          etag off;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
          root   /usr/share/nginx/html;
        }
      }
    }
kind: ConfigMap
metadata:
  name: np-config
